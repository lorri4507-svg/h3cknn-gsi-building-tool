```yaml
name: "🔧 Lunaris GSI → Pixel 7 (eSIM + Lockscreen Stability)"

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "📥 Direct URL to the GSI (.img.xz / .img)"
        required: true
        type: string
        default: "https://github.com/Doze-off/Lunaris-AOSP_gsi/releases/download/2026-09-20/Lunaris-3.12-GSI_treble_arm64-ab-GAPPS-Official-20260920.img.xz"

      output_name:
        description: "📛 Output GSI name"
        required: true
        default: "Lunaris_Pixel7_eSIM_Lockscreen_GSI"
        type: string

      fs_type:
        description: "💾 Output filesystem"
        required: true
        default: "ext4"
        type: choice
        options:
          - "ext4"
          - "erofs"

      require_esim_stack:
        description: "📶 Fail if no eUICC/eSIM stack is present"
        required: true
        default: true
        type: boolean

      factory_image_url:
        description: "📱 Matching Pixel 7 panther factory ZIP"
        required: false
        default: "https://dl.google.com/dl/android/aosp/panther-bp4a.251205.006-factory-4455f800.zip"
        type: string

      inject_stock_euicc:
        description: "📶 Inject Google Pixel eUICC apps from stock"
        required: true
        default: true
        type: boolean

      inject_stock_compat:
        description: "🔐 Inject targeted stock Pixel permissions/sysconfig/biometric/credential compatibility files"
        required: true
        default: true
        type: boolean

      inject_stock_overlays:
        description: "🎨 Try targeted Pixel stock overlays for lockscreen/biometric/resource compatibility"
        required: true
        default: true
        type: boolean

      include_vendor_images:
        description: "🧩 Bundle matching stock vendor/ODM/DLKM/security firmware"
        required: true
        default: true
        type: boolean

      custom_kernel_boot_url:
        description: "🧬 Optional custom panther boot.img"
        required: false
        default: ""
        type: string

      wipe_userdata:
        description: "🧹 Flash script wipes userdata (recommended for credential/KeyMint repair)"
        required: true
        default: true
        type: boolean

jobs:
  port_gsi:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    concurrency:
      group: port-gsi-pixel7
      cancel-in-progress: false

    permissions:
      contents: write

    steps:

      - name: "📦 Checkout Repository"
        uses: actions/checkout@v5

      - name: "🧹 Free Runner Disk Space"
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift || true

          sudo docker image prune --all --force || true
          df -h /

      - name: "⚙️ Install Dependencies"
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            xz-utils \
            android-sdk-libsparse-utils \
            e2fsprogs \
            erofs-utils \
            rsync \
            attr \
            xxd \
            file \
            unzip \
            zip \
            python3 \
            python3-xml \
            jq

      # ================================================================
      # STOCK PIXEL 7
      # ================================================================

      - name: "📥 Fetch Pixel 7 Stock Firmware"
        env:
          FACTORY_URL: ${{ inputs.factory_image_url }}
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          F="$W/factory"

          mkdir -p "$F"
          cd "$F"

          if [ -z "$FACTORY_URL" ]; then
            echo "::warning::No factory_image_url supplied."
            exit 0
          fi

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            -o factory.zip \
            "$FACTORY_URL"

          EXPECTED=$(
            basename "${FACTORY_URL%%\?*}" |
            sed -nE 's/.*-factory-([0-9a-f]{8})\.zip$/\1/p'
          )

          if [ -n "$EXPECTED" ]; then
            ACTUAL=$(sha256sum factory.zip | cut -c1-8)

            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Factory image checksum mismatch."
              echo "Expected: $EXPECTED"
              echo "Actual:   $ACTUAL"
              exit 1
            fi

            echo "Factory checksum OK: $ACTUAL"
          fi

          unzip -q factory.zip -d fx
          rm -f factory.zip

          IMGZIP=$(find fx -name 'image-panther-*.zip' | head -n1)

          if [ -z "$IMGZIP" ]; then
            echo "::error::No image-panther-*.zip found."
            echo "The supplied factory image is not a Pixel 7 panther factory image."
            exit 1
          fi

          unzip -q "$IMGZIP" -d img
          rm -rf fx

          echo "::group::Stock Pixel images"
          find img -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo "::endgroup::"

      # ================================================================
      # EXTRACT STOCK COMPATIBILITY MATERIAL
      #
      # IMPORTANT:
      # We deliberately DO NOT replace Lunaris SystemUI/framework.
      # Those APK/JARs can be tightly coupled to the GSI.
      #
      # Instead we pull:
      #   - permissions
      #   - sysconfig
      #   - Pixel feature declarations
      #   - biometric/credential configuration
      #   - selected overlays
      #   - eUICC
      # ================================================================

      - name: "🔐 Extract Pixel Stock Compatibility Layer"
        env:
          INJECT_EUICC: ${{ inputs.inject_stock_euicc }}
          INJECT_COMPAT: ${{ inputs.inject_stock_compat }}
          INJECT_OVERLAYS: ${{ inputs.inject_stock_overlays }}
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          F="$W/factory"
          C="$W/stock-compat"

          mkdir -p "$C"

          if [ ! -d "$F/img" ]; then
            echo "::warning::No factory images available."
            exit 0
          fi

          hex_at() {
            dd if="$1" bs=1 skip="$2" count="$3" 2>/dev/null | xxd -p
          }

          mount_stock() {
            local IMG="$1"
            local NAME="$2"
            local RAW="$F/${NAME}.raw"
            local MNT="$F/mnt_${NAME}"

            mkdir -p "$MNT"

            if [ "$(hex_at "$IMG" 0 4)" = "ed26ff3a" ]; then
              simg2img "$IMG" "$RAW"
              IMG="$RAW"
            fi

            if sudo mount -o loop,ro,noload "$IMG" "$MNT" 2>/dev/null; then
              echo "$MNT"
              return 0
            fi

            rm -rf "$MNT"
            return 1
          }

          cleanup_mount() {
            local MNT="$1"

            sudo umount "$MNT" 2>/dev/nu
```
